name: Deploy to k3s

# Build the image, push it to GHCR, then join the home tailnet and roll it out
# to the k3s cluster (t1/t2/t3). Public traffic reaches the cluster through the
# in-cluster Cloudflare tunnel; nothing here is exposed to the internet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push ghcr.io/matsubo/rainbow-keyboard
  id-token: write # Tailscale OIDC trust credential (no stored Tailscale secret)

env:
  IMAGE: ghcr.io/matsubo/rainbow-keyboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_GTM_ID is inlined by `next build`, so it is a build arg
      # (repository variable), not a runtime setting.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: |
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Joins as an ephemeral tag:ci node. The tailnet policy lets tag:ci reach
      # only tcp:6443 on t1/t2/t3, so the tailnet's DNS (AdGuard on n4) is out of
      # reach: keep the runner's own resolver with --accept-dns=false.
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: TNSPGzaJJp11CNTRL-kxkcevvN8k11CNTRL
          audience: api.tailscale.com/TNSPGzaJJp11CNTRL-kxkcevvN8k11CNTRL
          tags: tag:ci
          args: --accept-dns=false

      # kubectl comes with the ubuntu-latest runner image.

      # KUBECONFIG is the rainbow-keyboard/deployer ServiceAccount: it can only
      # manage the Deployment, Service and Ingress in namespace rainbow-keyboard.
      - name: Roll out
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sed "s|image: IMAGE$|image: $IMAGE:$GITHUB_SHA|" deploy/k8s.yaml | kubectl apply -f -
          kubectl -n rainbow-keyboard rollout status deploy/rainbow-keyboard --timeout=300s
